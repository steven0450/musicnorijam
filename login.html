<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | 뮤직잼노리잼</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon">

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- Web Fonts -->
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquareRound@1.0/nanumsquareround.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        /* 로그인 전용 중앙 정렬 바디 스타일 */
        body {
            background-color: var(--bg-gray);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
        }
    </style>
</head>

<body>

    <div class="container d-flex justify-content-center">
        <div class="login-card">

            <!-- 상단 메인으로 돌아가기 -->
            <div class="mb-3 text-start">
                <a href="index.html" class="text-muted text-decoration-none small font-round">
                    <i class="bi bi-arrow-left me-1"></i> 메인 홈으로 돌아가기
                </a>
            </div>

            <!-- 로그인 카드 박스 -->
            <div class="card border-0 shadow-sm rounded-4 p-4 p-sm-5 bg-white">
                <!-- 브랜드 로고 & 타이틀 -->
                <div class="text-center mb-4">
                    <a href="index.html" class="text-decoration-none d-inline-block">
                        <!-- 원형 로고 이미지 (중앙 배치) -->
                        <img src="assets/images/logo.png" alt="뮤직잼노리잼 로고" class="rounded-circle mb-2 shadow-sm"
                            style="width: 70px; height: 70px; object-fit: cover;">
                        <h3 class="font-round fw-bold text-dark mb-1">뮤직잼노리잼</h3>
                    </a>
                    <p class="text-muted small mb-0">학부모 및 교육기관 전용 공간</p>
                </div>

                <!-- 로그인 폼 (제출 시 alert 안내) -->
                <form onsubmit="alert('현재 시스템 점검 중입니다.\n로그인 기능은 준비 중입니다.'); return false;">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control rounded-3" id="loginEmail"
                            placeholder="name@example.com" required>
                        <label for="loginEmail">아이디 (이메일)</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" class="form-control rounded-3" id="loginPassword" placeholder="Password"
                            required>
                        <label for="loginPassword">비밀번호</label>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4 small text-muted">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">로그인 유지</label>
                        </div>
                        <a href="#" class="text-decoration-none text-muted" onclick="alert('관리자에게 문의해주세요.');">비밀번호
                            찾기</a>
                    </div>

                    <button type="submit" class="btn btn-purple w-100 py-3 font-round fw-bold rounded-3 mb-3">
                        로그인
                    </button>
                </form>

                <!-- 하단 안내 링크 -->
                <div class="text-center small text-muted pt-2 border-top">
                    아직 회원이 아니신가요?
                    <a href="#" class="text-purple font-round fw-bold text-decoration-none ms-1"
                        onclick="alert('현재 회원가입 서비스 준비 중입니다.');">회원가입</a>
                </div>
            </div>

            <!-- 푸터 카피라이트 -->
            <div class="text-center mt-4 text-muted small">
                &copy; 2026 뮤직잼노리잼. All rights reserved.
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
