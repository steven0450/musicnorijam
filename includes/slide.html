<!-- 메인 상단 이미지 슬라이더 모듈 -->
<section id="mainSlider" class="carousel slide carousel-fade pt-5 mt-3" data-bs-ride="carousel" data-bs-interval="4000">
    <!-- 하단 슬라이드 위치 표시 점 (Indicators) -->
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#mainSlider" data-bs-slide-to="0" class="active" aria-current="true"
            aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#mainSlider" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#mainSlider" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>

    <!-- 슬라이드 이미지 & 텍스트 콘텐츠 -->
    <div class="carousel-inner">
        <!-- 슬라이드 1 -->
        <div class="carousel-item active">
            <div class="position-relative overflow-hidden">
                <img src="https://via.placeholder.com/1200x480/8a2be2/FFFFFF?text=Music+Jam+Nori+Jam+1"
                    class="d-block w-100" alt="메인 슬라이드 1">
                <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-25"></div>
                <div class="carousel-caption d-flex flex-column align-items-center justify-content-center h-100 pb-0">
                    <span class="badge bg-purple-soft text-purple mb-2 px-3 py-2 rounded-pill font-round">Early
                        Childhood Music</span>
                    <h2 class="font-round fw-bold text-white display-6 mb-2">오감 자극 신나는 음악 퍼포먼스</h2>
                    <p class="font-round text-white-50 small mb-4">아이들의 감성과 창의력이 자라는 뮤직잼노리잼입니다.</p>
                    <a href="#contact" class="btn btn-purple font-round rounded-pill px-4 py-2 shadow-sm">
                        <i class="bi bi-chat-fill me-1"></i> 출강 문의하기
                    </a>
                </div>
            </div>
        </div>

        <!-- 슬라이드 2 -->
        <div class="carousel-item">
            <div class="position-relative overflow-hidden">
                <img src="https://via.placeholder.com/1200x480/ba55d3/FFFFFF?text=Music+Jam+Nori+Jam+2"
                    class="d-block w-100" alt="메인 슬라이드 2">
                <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-25"></div>
                <div class="carousel-caption d-flex flex-column align-items-center justify-content-center h-100 pb-0">
                    <span class="badge bg-purple-soft text-purple mb-2 px-3 py-2 rounded-pill font-round">Special
                        Curriculum</span>
                    <h2 class="font-round fw-bold text-white display-6 mb-2">1인 1교구 & 다채로운 악기 체험</h2>
                    <p class="font-round text-white-50 small mb-4">어린이집, 유치원, 문화센터 맞춤형 프리미엄 음악 프로그램</p>
                    <a href="instruments.html"
                        class="btn btn-light font-round text-purple rounded-pill px-4 py-2 shadow-sm">
                        교구 & 악기 둘러보기
                    </a>
                </div>
            </div>
        </div>

        <!-- 슬라이드 3 -->
        <div class="carousel-item">
            <div class="position-relative overflow-hidden">
                <img src="https://via.placeholder.com/1200x480/9370db/FFFFFF?text=Music+Jam+Nori+Jam+3"
                    class="d-block w-100" alt="메인 슬라이드 3">
                <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-25"></div>
                <div class="carousel-caption d-flex flex-column align-items-center justify-content-center h-100 pb-0">
                    <span class="badge bg-purple-soft text-purple mb-2 px-3 py-2 rounded-pill font-round">Professional
                        Instructors</span>
                    <h2 class="font-round fw-bold text-white display-6 mb-2">검증된 유아음악 전문 강사진</h2>
                    <p class="font-round text-white-50 small mb-4">아이들의 눈높이에서 따뜻하게 소통하는 선생님들입니다.</p>
                    <a href="team.html" class="btn btn-purple font-round rounded-pill px-4 py-2 shadow-sm">
                        강사진 소개 보기
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- 좌우 컨트롤 화살표 -->
    <button class="carousel-control-prev" type="button" data-bs-target="#mainSlider" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">이전</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#mainSlider" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">다음</span>
    </button>
</section>
